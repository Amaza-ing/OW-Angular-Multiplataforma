<app-mobile-header></app-mobile-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Información nativa del dispositivo</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-button expand="block" (click)="loadDeviceInfo()">
        Cargar información del dispositivo
      </ion-button>

      <ion-list>
        <ion-item>
          <ion-label>
            <h3>Nombre</h3>
            <p>{{ deviceName() }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Plataforma</h3>
            <p>{{ platform() }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Versión del sistema</h3>
            <p>{{ osVersion() }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Fabricante</h3>
            <p>{{ manufacturer() }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Batería</h3>
            <p>{{ batteryLevel() }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-label>
            <h3>Cargando</h3>
            <p>{{ isCharging() }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
