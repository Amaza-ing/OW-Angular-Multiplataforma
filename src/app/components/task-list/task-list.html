<section class="card">
  <div class="header">
    <h2>Lista de tareas</h2>

    <div class="stats">
      <span>Total: {{ taskStore.totalTasks() }}</span>
      <span>Completadas: {{ taskStore.completedTasks() }}</span>
      <span>Pendientes: {{ taskStore.pendingTasks() }}</span>
    </div>
  </div>

  <ul>
    @for (task of taskStore.tasks(); track task.id) {
      <li>
        <app-task-item [task]="task"> </app-task-item>
      </li>
    }
  </ul>
</section>
